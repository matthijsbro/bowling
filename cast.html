<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cast Sheet</title>
  <style>
    body { margin: 0; padding: 16px; background: #f4ead5; color: #2a2420; font-family: 'Patrick Hand', cursive; }
    h1 { font-size: 30px; margin: 4px 0 16px; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
    section { background: #fbf4e4; border: 3px solid #2a2420; border-radius: 14px 9px 16px 8px; padding: 10px 14px; box-shadow: 4px 5px 0 #d9c9a6; }
    h2 { margin: 0; font-size: 24px; }
    p { margin: 0 0 4px; font-size: 17px; color: #6b5f55; }
    svg { width: 100%; height: auto; display: block; font-family: 'Patrick Hand', cursive; }
    .ink { filter: var(--boil); }
  </style>
</head>
<body><script type="module" src="/src/client/cast/sheet.ts"></script></body>
</html>
