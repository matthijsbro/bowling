services:
  split:
    build: .
    ports: ["8080:8080"]
    # a named volume, so the folder belongs to the user the server runs as
    volumes: ["split-data:/app/data"]
    restart: unless-stopped
    # mail settings, TRUST_PROXY and every limit are read from .env (see .env.example); all are optional
    env_file:
      - path: .env
        required: false
volumes:
  split-data:
